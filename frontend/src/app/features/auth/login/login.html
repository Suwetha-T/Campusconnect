<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        
        <!-- Header / Logo -->
        <div class="text-center mb-4">
          <div class="bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center p-3 mb-3 shadow-sm">
            <i class="bi bi-mortarboard-fill fs-1"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
          <p class="text-muted small">Sign in to <strong>CampusConnect</strong></p>
        </div>

        <div class="card border-0 shadow-lg p-3">
          <div class="card-body">

            <div
              *ngIf="errorMessage"
              class="alert alert-danger d-flex align-items-center gap-2 small py-2 mb-3">
              <i class="bi bi-exclamation-triangle-fill"></i>
              <span>{{ errorMessage }}</span>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

              <div class="mb-3">
                <label class="form-label fw-medium small">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-envelope-fill"></i></span>
                  <input
                    type="email"
                    class="form-control border-start-0 ps-0"
                    placeholder="name@school.com"
                    formControlName="email"
                    [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                </div>

                <div
                  *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
                  class="invalid-feedback d-block small mt-1">
                  <span *ngIf="loginForm.get('email')?.errors?.['required']">
                    Email is required.
                  </span>
                  <span *ngIf="loginForm.get('email')?.errors?.['email']">
                    Enter a valid email address.
                  </span>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-medium small">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted border-end-0"><i class="bi bi-lock-fill"></i></span>
                  <input
                    type="password"
                    class="form-control border-start-0 ps-0"
                    placeholder="••••••••"
                    formControlName="password"
                    [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                </div>

                <div
                  *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                  class="invalid-feedback d-block small mt-1">
                  Password is required.
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 py-2.5 fw-semibold d-flex align-items-center justify-content-center gap-2"
                [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
                <span>{{ loading ? 'Signing in...' : 'Sign In' }}</span>
                <i *ngIf="!loading" class="bi bi-arrow-right-short fs-5"></i>
              </button>

            </form>

          </div>
        </div>

        <div class="text-center mt-4">
          <p class="text-muted small">
          <i class="bi bi-mortarboard-fill text-primary me-1"></i>
          CampusConnect &copy; 2026 &middot; Student Management System
        </p>
        </div>

      </div>
    </div>
  </div>
</div>
